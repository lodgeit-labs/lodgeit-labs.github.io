      The correct reference for a choice to use Commissioner's determination is 40-95(1)(a).   
      If a statutory cap in s40-102(4) or (5) is shorter than the Commissioner's determination of effective life for the asset, s40-102(2) is clear that the capped life applies.  
      Note that in the hypothetical asked by this question (5 year Commissioner's determination), there are no capped lives in s40-102(4) or (5) that are less than 5 years, therefore no capped life would apply.
