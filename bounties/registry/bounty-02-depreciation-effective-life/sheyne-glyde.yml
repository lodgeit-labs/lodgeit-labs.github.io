      Section 40-95(3) posed by the question is the incorrect citation reference for a choice to self-assess effective life.  
      The correct reference for a choice to self-assess is 40-95(1)(b).  
      Where this choice is made, section 40-105 requires an assessment of the period the asset can be used by any entity having regard to wear and tear you reasonably expect from your     expected circumstances of use of the asset and assuming the asset will be maintained in reasonably good order and condition.  A shorter period will also apply if it is expected the asset would likely be scrapped, abandoned or sold for no more than scrap value (unless due to reasons attributable to the technical risk in conducting R&D activities).   
      Self-assessment is particularly relevant for second-hand assets, per para 48 of TR 2022/1:  "The Commissioner only makes determinations of the effective life of new assets. If you purchase a second-hand asset where its condition justifies a shorter life than that determined by the Commissioner, you can self-assess."
      There is insufficient information in the example to determine a self-assessed life, however given the mini-excavator is second-hand and depending on its condition and expected usage, there may be a case for a shorter self-assessed life compared to the Commissioner's determination of effective life for mini-excavators.  The factors and analysis supporting the self-assessment decision would need to be documented by the taxpayer.
