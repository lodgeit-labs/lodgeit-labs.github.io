    reasoning: |
      Per s40-60, depreciation should only be calculated from the start time for the asset, which is when it is first used, or installed ready for use for any purpose.  
      Some examples where this may differ from purchase date could include:
      The asset is ordered but yet to be delivered;
      The asset is delivered but remains in a shipping container or is not fully assembled;
      The asset functions as part of a system (composite asset) and the individual components allowing operational use are missing or yet to be installed (refer TR 2024/1);
      The asset is sitting in inventory and not 'held in reserve'.
