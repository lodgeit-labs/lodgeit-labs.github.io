    citation_authority: "s 9, ss 10(2)-(3), s 136(1) FBTAA 1986; paras 22,101-105 TR 2001/2"
    reasoning: The sum paid by the employee is a “recipient’s payment” pursuant to s 9(1) and 9(2)(e) in relation to the statutory formula method, and s 10(2) and s 10(3)(c) of the FBTAA 1986 in respect of the operating cost method. NEWPARA Per section 136(1) of the FBTAA 1986, the term ‘recipients contribution’ is used in relation to car parking fringe benefit, a property fringe benefit, a residual fringe benefit or a board fringe benefit (a), and in relation to an expense payment fringe benefit (b). NEWPARA The confusion is understandable as even the ATO Publication Fringe Benefits Tax – A Guide for Employers, Chapter 22 ( https://www.ato.gov.au/law/view/document?docid=SAV/FBTGEMP/00023 ) defines ‘Employee or recipient's contribution’ as “Also known as a recipient's payment or recipient's rent”. NEWPARA The real difference is for the employer. Contributions paid directly to the employer are assessable income for income tax purposes, and treated as a taxable supply for GST purposes, meaning the employer will have to pay GST on this amount (as if the recipient’s payment included GST).  The taxable value of the fringe benefit is the GST-inclusive amount of the recipient payment (para 22 of TR 2001/2). Where contributions/payments were made to third parties, such as for fuel, oil, or servicing, will have had the GST remitted on it directly by those suppliers, and as such, the employer does not recognise it as a taxable supply for GST purposes, although the full amount remains assessable income (paras 101-105 TR 2001/2).
    edge_case_notes: Need to check that the employee has not been reimbursed for their payment or contribution. If they have, it will reduce the value of the payment. NEWPARA Need to check whether the employee directly contributed the amount to the employer or indirectly by paying for fuel, oil, servicing etc to third parties. As each has a different GST treatment for the employer.
