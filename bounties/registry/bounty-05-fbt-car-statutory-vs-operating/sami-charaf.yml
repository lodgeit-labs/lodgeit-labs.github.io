    citation_authority: "s 11(1AA), s 136(1) FBTAA 1986; s 40-72(1), s 40-100 ITAA 1997; TR 2022/1; LI 2025/20"
    reasoning: Deemed Depreciation Rate: NEWPARA The depreciation rate is defined in section 11(1AA) of FBTAA 1986 as DV percentage divided by effective life of the car. NEWPARA The depreciation rate is based on the ‘effective life of the car’ as specified in a determination made by the Commissioner under section 40-100 of the ITAA 1997 and in effect at the most recent time (before the end of the year of tax) the person became the owner of the car (s 11 ‘effective life of the car’ FBTAA 1986). NEWPARA The most recent such determination was made on the 2nd of September 2025 in LI 2025/20. However, the worked example relates to a car purchased 1 May 2024, and as such, the most recent determination at that time was TR 2022/1. That determination provides a life of 8 years for cars (motor vehicles designed to carry a load of less than one tonne and fewer than 9 passengers) generally. NEWPARA The DV percentage is the percentage applicable in using the diminishing value method (within the meaning of the ITAA 1997) as at the start of the relevant tax year (s 11 ‘DV percentage’ FBTAA 1986). For standard assets held on or after May 10, 2006, the diminishing value percentage under the ITAA 1997 is 200% (s 40-72(1) ITAA 1997). NEWPARA Hence, the relevant depreciation rate 200%/8 = 25%. Therefore the deemed depreciation rate of 25% is correct.  NEWPARA Whilst the underlying determination has changed in the past 3 years (last determination change was 2 September 2025 in LI 2025/20), the effective life of motor vehicles designed to carry a load of less than one tonne and fewer than 9 passengers generally remains 8 years and has not changed since 1 January 2006 (LI 2025/20). Neither has the 200% DV percentage since 10 May 2006 (s 40-72(1) ITAA 1997). Therefore, the resulting deemed depreciation rate of 25% has NOT changed in the past three FBT years. NEWPARA Interest Rate: NEWPARA The interest rate is set by legislation in section 11 of the FBTAA 1986 as the statutory interest rate in relation to the relevant FBT year. Section 136(1) of FBTAA 1986 defines ‘statutory interest rate’ as the benchmark interest rate in relation to the year of tax for all amounts after 1 July 1986. That is in turn defined by same section as the rate of interest, known as the large bank housing lenders variable interest rate on loans for housing for owner occupation, last published by the Reserve Bank of Australia before the commencement of the year of tax (s 136(1) ‘benchmark interest rate’ FBTAA 1986). This can be found at https://www.rba.gov.au/statistics/tables/#interest-rates in the Indicator Lending Rates – F5 table ( https://www.rba.gov.au/statistics/tables/xls/f05hist.xlsx ), as Series ID FILRHLBVS published monthly for the preceding month. Hence, for any FBT year commencing 1 April, the latest data would be the February data which is published in March. NEWPARA The relevant FBT year for the worked example commenced 1 April 2024 and ended 31 March 2025, hence the relevant rate is that of February 2024 for series FILRHLBVS, which is 8.77% (Cell D793 in Sheet ‘Data’ of https://www.rba.gov.au/statistics/tables/xls/f05hist.xlsx?v=2026-07-08-17-51-36 ). Therefore the rate of 8.77% is correct. NEWPARA FIX – The question asks "Are those the correct rates for FY2025 FBT year?", caution must be used with this terminology which uses both FY (financial year) and FBT year as the FY2025 interest rate (such as that used for div 7A ITAA 1936 purposes) may be different to the FBT2025 interest rate. NEWPARA Coincidentally, the Division 7A ITAA 1936 benchmark interest rate for FY2025 (based on the June 2024 rather than February 2024 indicator lending rates) is also 8.77% (https://www.ato.gov.au/tax-rates-and-codes/division-7a-benchmark-interest-rate). However, for FY2026 the rate was 8.37% for Div 7A purposes, but is 8.62% for FBT2026. It is unclear where the 8.77% is coming from in the worked example. NEWPARA Hence, the benchmark interest rate is not fixed and varies each year. Data from Table 10 of the Fringe Benefit Tax Rates and Thresholds https://www.ato.gov.au/tax-rates-and-codes/fringe-benefits-tax-rates-and-thresholds clearly shows the rate varying from 4.52% for FBT2023, to 7.77% for FBT2024, to 8.77% for FBT2025, to 8.62% for FBT2026, to 8.27% for FBT2027. Hence, the rate HAS changed on the last three FBT years. NEWPARA Incorrect References: NEWPARA TR 2024/D3 is a draft taxation ruling which has been finalised by TR 2025/2, but it relates to Income tax: aspects of the third party debt test in Subdivision 820-EAB of the ITAA 1997 and does NOT relate to the interest rate and deemed depreciation under s 11 of the FBTAA 1986 ( https://www.ato.gov.au/law/view/document?DocID=DTR/TR2024D3/NAT/ATO/00001&PiT=99991231235958 ).
    edge_case_notes: Consider vehicles that are not cars (motor vehicles designed to carry a load of less than one tonne and fewer than 9 passengers) generally, such as taxis made available to use by drivers, the relevant effective life would be substantially shorter at 4 years (TR 2022/1). NEWPARA The formulas used for both deemed depreciation and deemed interest assume that the number of days the car was held for fringe benefit purposes was equal to the number of days the car was owned in the FBT year. This assumption should NOT be made, and the full formula for each should instead be adopted from legislation.
