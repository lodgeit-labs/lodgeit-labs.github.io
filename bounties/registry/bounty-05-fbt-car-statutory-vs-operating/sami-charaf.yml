## 4. Edge cases surfaced

_Anything the brief did not cover that you think should be tested by a future revision._

1. Engine must not use currently implemented statutory formula except for 2015 FBT year onwards. This is due to transitional rates applying in respect of earlier FBT years.
2. Engine should differentiate between a log book and non log book year and ensure requirements for each are met.
3. Engine should check that the logbook was prepared in the preceding 4 FBT years, and that the pattern of usage has not changed.
4. Calculator has not demonstrated ability to reduce base value by the once-only one-third of cost price after four years of holding the car.
5. Calculator does not take into account whether the transaction was at arm's length or not and substitute arm's length value accordingly.
6. The worked example and brief do not demonstrate the engine's capability for lease-based transactions.
7. Consider vehicles that are not cars (motor vehicles designed to carry a load of less than one tonne and fewer than 9 passengers) generally, such as taxis made available to use by drivers, the relevant effective life would be substantially shorter at 4 years (TR 2022/1).
8. The formulas used for both deemed depreciation and deemed interest assume that the number of days the car was held for fringe benefit purposes was equal to the number of days the car was owned in the FBT year. This assumption should NOT be made, and the full formula for each should instead be adopted from legislation.
9. Need to check that the employee has not been reimbursed for their payment or contribution. If they have, it will reduce the value of the payment.
10. Need to check whether the employee directly contributed the amount to the employer or indirectly by paying for fuel, oil, servicing etc to third parties. As each has a different GST treatment for the employer.
11. Even when the operating cost method is elected, if the statutory formula results in a lower taxable value, legislation operates to act as if that election had never been made (s 10(5) FBTAA 1986).
12. If the car is unregistered for the whole of the FBT year when the car was held and was used wholly or principally in direct connection with your business operations, any private use is exempt from FBT. This is quite common with rural and farm entities that provide off-road vehicles.
13. Emergency service cars that are not actually used for private use will not be deemed to be available for private use even if available for private use. The engine needs to check whether the vehicle is an emergency service vehicle.
14. The engine needs to check if more than one car benefit is provided to the employee by a personal services entity, if so, only one car is subject to FBT, the remainder are exempt.
15. Need to check whether the car is a car, taxi, panel van or utility truck designed to carry a load of less than 1 tonne. If not, then it may not be subject to a car fringe benefit tax altogether.
16. Need to check if the pattern of use of the car has changed since the log book was completed. If so, a new logbook is required.
17. Cars owned by foreign companies have separate rules and steps should be undertaken to ensure the vehicle is not subject to them before using the current calculation.
18. Electric or Hydrogen Fuel Cell vehicles have separate rules and may be exempt from FBT under certain circumstances.
19. Need to check days unavailable and holiday garaging, such as when undergoing repairs, or when you are overseas, as these can reduce the availability of the car for private use in the FBT year, and reduce the FBT liability accordingly.

