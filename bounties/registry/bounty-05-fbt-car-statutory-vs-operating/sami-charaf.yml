# Reviewer Verdict — FBT car — statutory formula vs operating cost

**Bounty:** bounty-05-fbt-car-statutory-vs-operating

## 1. Top-level verdict

**Your top-level verdict:**

FIX

Fix the operating cost formula.
Fix the base value definition for the statutory method to exclude certain on-road costs such as stamp duty, compulsory third party, and initial registration.
Fix the definition of operating expenses to apportion pre-paid operating costs to the holding period for a specific FBT year.
Fix the deemed interest formula. The version used is a simplified version of that in legislation and based on the critical assumption that the number of days the car was held for fringe benefit purposes was equal to the number of days the car was owned in the FBT year.
Fix the deemed statutory interest rate to use the FBT benchmark interest rate, not the general or Div 7A benchmark interest rate.
Fix the deemed depreciation formula. The version used is a simplified version of that in legislation and based on the critical assumption that the number of days the car was held for fringe benefit purposes was equal to the number of days the car was owned in the FBT year.

