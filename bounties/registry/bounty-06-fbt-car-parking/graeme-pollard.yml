## 2. Per-question verdicts

```yaml
per_question_verdicts:
  - question_number: 1
    verdict: "ACCEPT"              # ACCEPT / REJECT / FIX
    citation_authority: "ATO Car Parking Threshold Rates Table (FY2025)"   # section reference or case citation
    reasoning: |
      The engine correctly identifies the FY2025 threshold as $10.77.
    edge_case_notes: |
      None.
  - question_number: 2
    verdict: "FIX"              # ACCEPT / REJECT / FIX
    citation_authority: "FBTAA 1986, s 39B; TR 2021/2, para 17"   # section reference or case citation
    reasoning: |
      The engine incorrectly evaluates the 1 km radius by reference to a Google Maps straight line radius search. However the 1km distance is not to be measured as a straight line or 'as the crow flies'. Instead, it must be measured via the 'shortest practicable route', travelled by foot, car, train or boat, starting from the closest vehicle entrance of the employer's work car park to the closest vehicle entrance of the commercial parking station. Currently the engine identifies all stations within a 1km radius, however these stations must pass through a second filter to exclude those whose 'shortest practicable route' exceeds 1km.
    edge_case_notes: |
      The calculator engine code must be updated to transition away from raw geodesic distance models and instead query a road-network routing API that calculates true travel-path distances.
  - question_number: 3
    verdict: "ACCEPT"              # ACCEPT / REJECT / FIX
    citation_authority: "FBTAA 1986, s 39A; TR 2021/2, paras 34-41; Commissioner of Taxation v Toowoomba Regional Council [2026] FCAFC 50"   # section reference or case citation
    reasoning: |
      The engine correctly identifies stations 4 and 5 as commercial parking stations. The test in accordance with TR 2021/2 is purely objective: if the facility is permanent, open to the public, and charges a fee for all-day parking in the ordinary course of business, it is a commercial parking station. The previous position under TR 96/26 that car parks primary to another business purpose (like hotels, hospitals, churches, or shopping centres) is no longer relevant.  
    edge_case_notes: |
      The position as established by TR 2021/2 was confirmed by the Federal Court decision in Commissioner of Taxation v Toowoomba Regional Council [2026] FCAFC 50, which also confirmed that the "40% capacity rule" is no longer relevant.
  - question_number: 4
    verdict: "ACCEPT"              # ACCEPT / REJECT / FIX
    citation_authority: "TR 2021/2, para 4"   # section reference or case citation
    reasoning: |
      The engine correctly identifies that 'all-day parking' means a continuous 6+ hour period during the day.
    edge_case_notes: |
      None.
  - question_number: 5
    verdict: "ACCEPT"              # ACCEPT / REJECT / FIX
    citation_authority: "TR 2021/2, para 52"   # section reference or case citation
    reasoning: |
      The engine correctly adopts the early-bird rate as the 'lowest fee'. It is irrelevant that the employer's specific employees may arrive too late to use it. The threshold test measures public availability, not individual employee behavior. Because the engine's filter (`if s.is_all_day_parking`) has already established that the stations being evaluated meet the 6-hour continuous stay profile, running a flat `min()` across those qualified entries produces a legally correct result.
    edge_case_notes: |
      None.
  - question_number: 6
    verdict: "FIX"              # ACCEPT / REJECT / FIX
    citation_authority: "FBTAA 1986, s 39AB; TR 2021/2, paras 50-51"   # section reference or case citation
    reasoning: |
      The engine completely overlooks the mandatory 'Representative Fee' test. Paragraph 50 of TR 2021/2 establishes that an employer cannot use an isolated, one-day cheap promotional rate if it is unrepresentative of the provider's standard fees. The engine needs a fix to look at a broader 4-week window to ensure it reflects a stable market rate on the first business day of the FBT year.
    edge_case_notes: |
      The calculator engine requires a database structural upgrade to support historical 4-week rate logs rather than relying entirely on a single daily snapshot variable.
