# Reviewer Verdict — CGT small business 15-year exemption

**Bounty:** bounty-08-cgt-sb-15-year-exemption

## 1\. Top-level verdict

*Choose one: **ACCEPT** / <b>REJECT</b> / <b>FIX</b>.*

* **ACCEPT** — the calculator's statute-to-predicate translation is correct on the facts of the brief. Minor stylistic comments allowed.
* **REJECT** — the calculator's translation is materially wrong. State the section/case-law authority you rely on.
* **FIX** — the translation is mostly correct but has a specific error that can be fixed with a targeted change. Describe the fix.

**Your top-level verdict: FIX**

Three things need fixing.

**1. Add s 152-10(2).** The asset is shares, and the brief never mentions this subsection. Since 8 February 2018 it adds three basic conditions for share sales: a modified active asset test on the s 152-10(2A)/(2B) assumptions; the object entity must be a CGT SBE or satisfy MNAV (each 40% in s 328-125 read as 20%); and the stakeholder / 90% test. It is the biggest gap, and it fails quietly.

**2. s 152-110(1)(c) is cumulative, not continuous.** The brief says a significant individual is needed "at all times". The section says a total of at least 15 years, and expressly that the years need not be continuous or the same person.

**3. s 152-35 is 7.5 years, not "the majority of ownership".** For an asset owned over 15 years the section asks for a total of 7.5 years. The worked example also merges this with the separate 80% composition test in s 152-40(3).

The predicted verdict doesn't follow either. MNAV, the 80% test, the s 152-110(1)(c) count, s 152-110(1)(d) and all of s 152-10(2) are unresolved on the facts given, so eligibility isn't established.

Predicate list at Appendix A, per brief section 3.

