## 4\. Edge cases surfaced

Item 1 is my answer to Q7. Items 2 to 8 cover the brief's listed candidates and the smaller points.

1. **s 152-10(2) is absent from the spec entirely.** Not on the candidate list, not tested by any of Q1 to Q6, and capable of changing the answer on its own. Since 8 February 2018 the basic conditions for a share sale also require a modified active asset test on the s 152-10(2A)/(2B) assumptions, the object entity to be a CGT SBE or satisfy MNAV with each 40% in s 328-125 read as 20%, and the CGT concession stakeholder / 90% test. Two consequences worth separating. A calculator built to the brief returns eligible on share sales that fail these conditions, and the failure is silent because nothing in the condition set is looking. And the s 152-10(2A) test is materially harder than s 152-40(3) alone and applies across the ownership period, so it isn't one extra check at the end. Needs a test case per limb.
2. **MNAV probably fails.** Wilson Trading is wholly owned, so its value counts, and the $4.2M price is evidence of it. Add Bob's and Maree's assets and $6M is close. Turnover under $2M may fail too. Worth a case where both fail.
3. **Trustee change vs resettlement.** Changing trustee doesn't change the owner. A resettlement does (TD 2012/21, with *Clark* \[2011] FCAFC 5 and *Commercial Nominees* \[2001] HCA 33). Test whether the trust estate continued.
4. **Changing distribution patterns.** These move item 3 year by year. 100% to Bob for ten years then split five ways for six can leave fewer than 15 qualifying years with no structural change at all.
5. **Rollovers.** Only Subdiv 124-B and 126-A continue the period. Subdiv 122-A and scrip-for-scrip under Subdiv 124-M restart it.
6. **Partial disposal.** Ownership and the active asset test hold on the shares sold. The retirement nexus is what fails — keeping 40% is hard to square with a significant reduction in hours.
7. **Ordering.** Subdiv 152-B sits outside the s 102-5 method statement: gain goes entirely, no capital losses applied, Div 115 never reached. No election, and s 152-215, s 152-330 and s 152-430 shut out the other three concessions where it applies. Test it first, treat it as dispositive.
8. **Three small ones.** Earnouts (Subdiv 118-I shifts proceeds, income year and the s 152-125 deadline); a June contract with July settlement; and residency under s 152-40(3)(a).

