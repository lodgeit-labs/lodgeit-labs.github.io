      # The worked example assumes that ownership, control and connected-entity relationships remain unchanged throughout the ownership period. A calculator should not make this assumption.

Because active asset status is tested throughout the ownership period, the calculator should accommodate changes such as:

changes in partnership interests;
admission or retirement of partners;
changes in trust ownership arrangements;
changes of trustee;
changes in shareholdings affecting connected-entity status;
business restructures; and
transactions that cause an entity to cease being connected with the asset owner.
The calculator should re-assess active asset status whenever a relevant ownership, control or connected-entity change occurs.


