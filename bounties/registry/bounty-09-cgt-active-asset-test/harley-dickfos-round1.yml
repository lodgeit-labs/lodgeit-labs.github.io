# Reviewer Verdict — CGT small business active-asset test

**Bounty:** bounty-09-cgt-active-asset-test

## 1. Top-level verdict

_Choose one: **ACCEPT** Accept

- **ACCEPT** — the calculator's statute-to-predicate translation is correct on the facts of the brief. Minor stylistic comments allowed.

**Your top-level verdict:**
I would conclude that the worked example produces the correct outcome and is broadly consistent with the active asset provisions.

However, it should not be treated as a complete calculator specification without further refinement.

In particular:

the example may imply a 50% threshold that does not appear in the legislation;
it assumes floor area is the preferred measurement methodology;
it provides limited guidance regarding vacancy periods;
it does not adequately address changing ownership or connected-entity relationships over time; and
it does not fully explore the interaction between s 152-40(1), s 152-40(1A) and s 152-40(4)(e).
Accordingly, the example is best viewed as a useful illustration of the legislative outcome rather than a complete implementation specification.
