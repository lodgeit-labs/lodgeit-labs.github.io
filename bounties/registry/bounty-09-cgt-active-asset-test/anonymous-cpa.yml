&#x20;     and the now-superseded s 23 ITRA 1986 lower-corporate-tax-rate test. It

&#x20;     contains no proportional main-use-to-derive-rent methodology and does

&#x20;     not mention floor area, rental value, or time-based apportionment

&#x20;     proxies anywhere in the ruling.
