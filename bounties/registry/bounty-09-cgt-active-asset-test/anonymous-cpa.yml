&#x20;     intangible-asset limb (goodwill etc. inherently connected with such a

&#x20;     business). The commonly-used "three limbs" framing folds in the

&#x20;     separate share/interest deeming rule at s 152-40(3) (the 80% active-asset

&#x20;     test for shares/trust interests). This is a defensible shorthand in

&#x20;     practice but should be labelled as combining s 152-40(1) with s 152-40(3),

&#x20;     not presented as three sub-paragraphs of s 152-40(1) alone. |
      
    edge\_case\_notes: |
      If the calculator ever needs to handle shares in a holding company or

&#x20;     trust interests (rather than a direct asset), s 152-40(3)'s 80% test is

&#x20;     a materially different mechanism and should be a distinct code path,

&#x20;     not folded into the s 152-40(1) logic.


