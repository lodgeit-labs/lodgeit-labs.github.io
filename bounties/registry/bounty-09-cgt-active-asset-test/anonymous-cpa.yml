## 4\. Edge cases surfaced

*Anything the brief did not cover that you think should be tested by a future revision.*

1. Vacancy periods — confirmed as a "pure cost" to the half-of-ownership ratio (denominator runs, numerator doesn't gain), but the brief's facts don't create a case where this is outcome-determinative; a tighter fact pattern should be added to the test suite.
2. Temporary-use carve-out (s 152-40(4)(e)) untested — a short-term lease pending redevelopment or resale would exercise the "only temporarily" exception, which this brief's scenario never triggers.
3. Div 108 separate-asset improvements — a large capital improvement mid-ownership could require splitting the active-asset and half-of-ownership calculations across two assets with different start dates. Not addressed anywhere in this bounty.
4. Mid-ownership changes to trust/partnership/connected-entity status — affects both the Q5 connected-entity analysis and downstream CGT-concession-stakeholder requirements; not addressed.

